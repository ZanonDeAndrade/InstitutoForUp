name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build public frontend
        run: npm run build

      - name: Build admin frontend
        run: npm run build:admin

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/forup_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/forup_ci
      STORAGE_DRIVER: local
      UPLOADS_DIR: uploads-test
      GOOGLE_SHEETS_CLIENT_EMAIL: service-account@test.local
      GOOGLE_SHEETS_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        test-private-key-body
        -----END PRIVATE KEY-----
      GOOGLE_SHEETS_SPREADSHEET_ID: spreadsheet-id
      ADMIN_TOKEN_SECRET: ci-token-secret-12345678901234567890
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8081
      CAPTCHA_PROVIDER: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Validate Prisma schema
        working-directory: server
        run: npm run prisma:validate

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck backend
        working-directory: server
        run: npm run typecheck

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Test backend
        working-directory: server
        run: npm test

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for frontend audit
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm run audit:ci

      - name: Setup Node.js for backend audit
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Audit backend dependencies
        working-directory: server
        run: npm run audit:ci
